name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GCC_VERSION: gcc-13
  GXX_VERSION: g++-13

jobs:
  # ============================================================================
  # Stage 1: Full CI validation before release
  # ============================================================================

  ci:
    name: CI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential gcc-13 g++-13 lcov cppcheck clang-tidy-17 clang-format-17

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=gcc-13
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_WARN_ERROR=ON
          -DFC_PROFILE=production
          -DFC_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Verify zero warnings
        run: |
          cmake --build build --parallel $(nproc) 2>&1 | tee build_output.txt
          if grep -qi "warning:" build_output.txt; then
            echo "::error::Release build contains compiler warnings."
            exit 1
          fi

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage
        run: |
          lcov --capture --directory build --output-file lcov.info
          lcov --remove lcov.info '/usr/*' '*/third_party/*' '*/tests/*' --output-file lcov_filtered.info

      - name: Enforce coverage thresholds
        run: |
          TOTAL_LINE=$(lcov --summary lcov_filtered.info 2>&1 | grep "lines" | grep -oP '[\d.]+(?=%)')
          TOTAL_FUNC=$(lcov --summary lcov_filtered.info 2>&1 | grep "functions" | grep -oP '[\d.]+(?=%)')
          TOTAL_BRANCH=$(lcov --summary lcov_filtered.info 2>&1 | grep "branches" | grep -oP '[\d.]+(?=%)')

          echo "Line: ${TOTAL_LINE}%  Function: ${TOTAL_FUNC}%  Branch: ${TOTAL_BRANCH}%"

          FAILED=0
          if [ $(echo "$TOTAL_LINE < 100" | bc -l) -eq 1 ]; then echo "::error::Line coverage below 100%"; FAILED=1; fi
          if [ $(echo "$TOTAL_FUNC < 100" | bc -l) -eq 1 ]; then echo "::error::Function coverage below 100%"; FAILED=1; fi
          if [ $(echo "$TOTAL_BRANCH < 100" | bc -l) -eq 1 ]; then echo "::error::Branch coverage below 100%"; FAILED=1; fi
          if [ "$FAILED" -eq 1 ]; then exit 1; fi

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=all \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --std=c++23 \
            --check-level=exhaustive \
            -I include/ \
            src/

      - name: Check formatting
        run: |
          find include/ src/ -name '*.hpp' -o -name '*.cpp' | xargs \
            clang-format-17 --dry-run --Werror

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: build/
          retention-days: 90

  # ============================================================================
  # Stage 2: Create GitHub Release
  # ============================================================================

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: build/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/**/*.a
            build/**/*.so
