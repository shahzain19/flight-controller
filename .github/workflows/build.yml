name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-17
            cxx: clang++-17

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y gcc-13 g++-13
          else
            sudo apt-get install -y clang-17
          fi

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_WARN_ERROR=ON
          -DFC_PROFILE=production

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Verify no warnings
        run: |
          cmake --build build --parallel $(nproc) 2>&1 | tee build_output.txt
          if grep -qi "warning:" build_output.txt; then
            echo "ERROR: Compiler warnings detected. Warnings are treated as errors."
            exit 1
          fi
